<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎱 Magic 8-Ball</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .container {
    text-align: center;
    padding: 2rem;
  }
  h1 {
    color: #fff;
    font-size: 2.5rem;
    margin-bottom: 2rem;
    text-shadow: 0 0 20px rgba(255,255,255,0.1);
  }
  .ball {
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #1a1a2e, #000);
    margin: 0 auto 2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow:
      inset 0 -20px 40px rgba(0,0,0,0.8),
      0 0 60px rgba(100,100,255,0.15),
      0 20px 60px rgba(0,0,0,0.5);
    transition: transform 0.1s;
    user-select: none;
    position: relative;
  }
  .ball:active { transform: scale(0.95); }
  .ball::before {
    content: '';
    position: absolute;
    top: 15%;
    left: 20%;
    width: 35%;
    height: 25%;
    background: radial-gradient(ellipse, rgba(255,255,255,0.12), transparent);
    border-radius: 50%;
  }
  .window {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #1a2a6c, #0a0a1a);
    border: 4px solid #4a4a6a;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
    position: relative;
    z-index: 1;
  }
  #answer {
    color: #b8c6ff;
    font-size: 0.9rem;
    font-weight: 600;
    text-align: center;
    line-height: 1.3;
    transition: opacity 0.3s;
    text-shadow: 0 0 10px rgba(100,150,255,0.3);
  }
  .shaking { animation: shake 0.4s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px) rotate(-3deg); }
    40% { transform: translateX(8px) rotate(3deg); }
    60% { transform: translateX(-5px) rotate(-2deg); }
    80% { transform: translateX(5px) rotate(2deg); }
  }
  .hint {
    color: rgba(255,255,255,0.4);
    font-size: 0.9rem;
    margin-bottom: 1.5rem;
  }
  #question-input {
    padding: 0.8rem 1.2rem;
    border: 2px solid rgba(255,255,255,0.15);
    border-radius: 25px;
    background: rgba(255,255,255,0.06);
    color: #fff;
    font-size: 1rem;
    width: 320px;
    max-width: 90vw;
    outline: none;
    transition: border-color 0.2s;
  }
  #question-input:focus { border-color: rgba(100,150,255,0.4); }
  #question-input::placeholder { color: rgba(255,255,255,0.25); }
  button {
    margin-top: 0.8rem;
    padding: 0.7rem 2rem;
    border: none;
    border-radius: 25px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    font-size: 1rem;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(102,126,234,0.4); }
  button:active { transform: translateY(0); }
  .history {
    margin-top: 1.5rem;
    color: rgba(255,255,255,0.3);
    font-size: 0.8rem;
    max-height: 100px;
    overflow-y: auto;
  }
  .history p { margin: 0.3rem 0; }
  .history strong { color: rgba(255,255,255,0.5); }
</style>
</head>
<body>
<div class="container">
  <h1>🎱 Magic 8-Ball</h1>
  <div class="ball" id="ball" onclick="shake()">
    <div class="window">
      <div id="answer">8</div>
    </div>
  </div>
  <p class="hint">Click the ball or press Enter</p>
  <input id="question-input" type="text" placeholder="Ask a yes/no question..." onkeydown="if(event.key==='Enter') shake()">
  <br>
  <button onclick="shake()">Ask!</button>
  <div class="history" id="history"></div>
</div>
<script>
const answers = [
  "It is certain.", "Without a doubt.", "Yes, definitely.",
  "You may rely on it.", "As I see it, yes.", "Most likely.",
  "Outlook good.", "Signs point to yes.",
  "Reply hazy, try again.", "Ask again later.",
  "Better not tell you now.", "Cannot predict now.",
  "Concentrate and ask again.",
  "Don't count on it.", "My reply is no.",
  "My sources say no.", "Outlook not so good.",
  "Very doubtful."
];

let lastAnswer = null;

function shake() {
  const ball = document.getElementById('ball');
  const answerEl = document.getElementById('answer');
  const input = document.getElementById('question-input');
  const history = document.getElementById('history');

  let question = input.value.trim();
  if (!question) question = "the universe";

  ball.classList.remove('shaking');
  void ball.offsetWidth;
  ball.classList.add('shaking');

  let answer;
  do {
    answer = answers[Math.floor(Math.random() * answers.length)];
  } while (answer === lastAnswer);
  lastAnswer = answer;

  setTimeout(() => {
    answerEl.textContent = answer;
    const entry = document.createElement('p');
    entry.innerHTML = `<strong>Q:</strong> ${question} &rarr; ${answer}`;
    history.prepend(entry);
    while (history.children.length > 10) history.removeChild(history.lastChild);
  }, 400);

  input.value = '';
  input.focus();
}
</script>
</body>
</html>
