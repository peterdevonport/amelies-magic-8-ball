<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎱 Magic 8-Ball</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, sans-serif;
  min-height: 100vh;
  background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}
.container {
  text-align: center;
  padding: 2rem;
  width: 100%;
}
h1 {
  color: #fff;
  font-size: 2.5rem;
  margin-bottom: 1.5rem;
  text-shadow: 0 0 20px rgba(255,255,255,0.1);
}

.scene {
  width: 300px;
  height: 300px;
  margin: 0 auto 1.5rem;
  cursor: grab;
  user-select: none;
  touch-action: none;
  position: relative;
}
.scene:active { cursor: grabbing; }

#sphereCanvas {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  display: block;
  box-shadow:
    0 0 60px rgba(100,100,255,0.12),
    0 20px 60px rgba(0,0,0,0.5);
}

.window-click {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 100px;
  height: 90px;
  transform: translate(-50%, -50%);
  clip-path: polygon(50% 5%, 93% 88%, 7% 88%);
  cursor: pointer;
  z-index: 2;
  -webkit-tap-highlight-color: transparent;
}

.hint {
  color: rgba(255,255,255,0.4);
  font-size: 0.9rem;
  margin-bottom: 1.2rem;
}

#question-input {
  padding: 0.8rem 1.2rem;
  border: 2px solid rgba(255,255,255,0.15);
  border-radius: 25px;
  background: rgba(255,255,255,0.06);
  color: #fff;
  font-size: 1rem;
  width: 320px;
  max-width: 90vw;
  outline: none;
  transition: border-color 0.2s;
}
#question-input:focus { border-color: rgba(100,150,255,0.4); }
#question-input::placeholder { color: rgba(255,255,255,0.25); }

button {
  margin-top: 0.8rem;
  padding: 0.7rem 2rem;
  border: none;
  border-radius: 25px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: #fff;
  font-size: 1rem;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
}
button:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(102,126,234,0.4); }
button:active { transform: translateY(0); }

.history {
  margin-top: 1.5rem;
  color: rgba(255,255,255,0.3);
  font-size: 0.8rem;
  max-height: 100px;
  overflow-y: auto;
}
.history p { margin: 0.3rem 0; }
.history strong { color: rgba(255,255,255,0.5); }
</style>
</head>
<body>
<div class="container">
  <h1>🎱 Magic 8-Ball</h1>
  <div class="scene" id="scene">
    <canvas id="sphereCanvas" width="300" height="300"></canvas>
    <div class="window-click" id="windowClick" onclick="shake()"></div>
  </div>
  <p class="hint" id="hint">Drag to view any angle · Type a question, then tap the ball</p>
  <input id="question-input" type="text" placeholder="Ask a yes/no question..." onkeydown="if(event.key==='Enter') shake()">
  <br>
  <button onclick="shake()">Ask!</button>
  <div class="history" id="history"></div>
</div>

<script>
const answers = [
  "It is certain.", "Without a doubt.", "Yes, definitely.",
  "You may rely on it.", "As I see it, yes.", "Most likely.",
  "Outlook good.", "Signs point to yes.",
  "Reply hazy, try again.", "Ask again later.",
  "Better not tell you now.", "Cannot predict now.",
  "Concentrate and ask again.",
  "Don't count on it.", "My reply is no.",
  "My sources say no.", "Outlook not so good.",
  "Very doubtful."
];

let lastAnswer = null;
let isShaking = false;
let currentAnswer = '';
let answerOpacity = 0;

// 3D rotation in degrees — free rotation around both axes
let rotY = 20;  // horizontal (0-360)
let rotX = -15; // vertical (-90 to 90)
let isDragging = false, prevX, prevY;

const canvas = document.getElementById('sphereCanvas');
const ctx = canvas.getContext('2d');
const CX = 150, CY = 150, R = 148;
const PI = Math.PI;
const DEG = PI / 180;

function drawSphere() {
  ctx.clearRect(0, 0, 300, 300);

  const ry = rotY * DEG;
  const rx = rotX * DEG;
  const cosY = Math.cos(ry);
  const sinY = Math.sin(ry);
  const cosX = Math.cos(rx);
  const sinX = Math.sin(rx);

  // --- 1. Sphere base with gradient ---
  // Gradient center shifts to simulate light hitting the surface
  const lx = CX + sinY * 40 - sinX * 10;
  const ly = CY - sinX * 35 - sinY * 5;
  const grad = ctx.createRadialGradient(lx, ly, 5, CX, CY, R);
  grad.addColorStop(0, '#3a3a5a');
  grad.addColorStop(0.35, '#1a1a34');
  grad.addColorStop(0.7, '#0a0a18');
  grad.addColorStop(1, '#000');

  ctx.beginPath();
  ctx.arc(CX, CY, R, 0, PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();

  // --- 2. Sphere edge shadow for depth ---
  const edgeGrad = ctx.createRadialGradient(CX, CY, R * 0.85, CX, CY, R);
  edgeGrad.addColorStop(0, 'transparent');
  edgeGrad.addColorStop(1, 'rgba(0,0,0,0.4)');
  ctx.beginPath();
  ctx.arc(CX, CY, R, 0, PI * 2);
  ctx.fillStyle = edgeGrad;
  ctx.fill();

  // --- 3. Window (triangle) on the sphere surface ---
  // Map rotation to a point on the sphere surface
  const winRadius = R * 0.38;
  const winX = CX + sinY * winRadius;
  const winY = CY + sinX * winRadius;

  // Perspective scale: window gets narrower as it approaches the edge
  let winScale = cosY * cosX;
  // Allow slight visibility on the back side (negative scale = mirrored on back)
  const isFront = winScale > 0;
  const absScale = Math.abs(winScale);

  // Only draw window if not fully edge-on
  if (absScale > 0.05) {
    ctx.save();
    ctx.translate(winX, winY);

    // The window also rotates based on sphere rotation
    ctx.rotate(ry * 0.3);

    // Scale: width gets narrower as the window turns away
    const w = 55 * absScale;
    const h = 50;
    const skew = (1 - absScale) * 15;

    ctx.beginPath();
    ctx.moveTo(0, -h * 0.85);
    ctx.lineTo(w, h * 0.8 + skew);
    ctx.lineTo(-w, h * 0.8 - skew);
    ctx.closePath();

    // Window fill — darker on the back side
    if (isFront) {
      ctx.fillStyle = '#0f1a4a';
    } else {
      ctx.fillStyle = '#050510';
    }
    ctx.fill();

    // Window border glow
    ctx.strokeStyle = isFront ? 'rgba(100,140,255,0.25)' : 'rgba(50,70,150,0.1)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // --- 4. Answer text inside window ---
    if (isFront && absScale > 0.3) {
      const text = currentAnswer || '8';
      const fontSize = Math.max(8, Math.min(22, 26 * absScale));
      ctx.font = `bold ${fontSize}px system-ui`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const alpha = answerOpacity * 0.7 * absScale;
      ctx.fillStyle = `rgba(180,200,255,${alpha})`;
      // Word wrap for long answers
      if (text.length > 12 && fontSize > 10) {
        const mid = Math.ceil(text.length / 2);
        const parts = [];
        let breakIdx = text.indexOf('. ');
        if (breakIdx > 0) {
          parts.push(text.slice(0, breakIdx + 1));
          parts.push(text.slice(breakIdx + 2));
        } else {
          breakIdx = Math.floor(text.length / 2);
          parts.push(text.slice(0, breakIdx));
          parts.push(text.slice(breakIdx));
        }
        ctx.font = `bold ${fontSize * 0.75}px system-ui`;
        ctx.fillText(parts[0], 0, -8);
        ctx.fillText(parts[1], 0, 10);
      } else {
        ctx.fillText(text, 0, h * 0.05);
      }
    }

    ctx.restore();
  }

  // --- 5. Highlight (specular reflection) ---
  const hlX = CX + sinY * 50 - sinX * 15;
  const hlY = CY - sinX * 45 - cosY * 5;
  const hlGrad = ctx.createRadialGradient(hlX, hlY, 0, hlX, hlY, 55);
  const hlOpacity = Math.max(0.03, 0.14 - (Math.abs(sinY) + Math.abs(sinX)) * 0.12);
  hlGrad.addColorStop(0, `rgba(255,255,255,${hlOpacity})`);
  hlGrad.addColorStop(0.5, `rgba(255,255,255,${hlOpacity * 0.3})`);
  hlGrad.addColorStop(1, 'transparent');
  ctx.beginPath();
  ctx.arc(CX, CY, R, 0, PI * 2);
  ctx.fillStyle = hlGrad;
  ctx.fill();

  // --- 6. Shadow overlay — darkens the bottom/opposite side ---
  const sx = CX - sinY * 50;
  const sy = CY + sinX * 50;
  const shadowGrad = ctx.createRadialGradient(sx, sy, 0, CX, CY, R);
  shadowGrad.addColorStop(0, 'transparent');
  shadowGrad.addColorStop(0.6, 'rgba(0,0,0,0.1)');
  shadowGrad.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.beginPath();
  ctx.arc(CX, CY, R, 0, PI * 2);
  ctx.fillStyle = shadowGrad;
  ctx.fill();
}

function applyRotation() {
  drawSphere();
}

function shake() {
  if (isShaking) return;

  const input = document.getElementById('question-input');
  const history = document.getElementById('history');
  const hint = document.getElementById('hint');

  let question = input.value.trim();
  if (!question) {
    input.placeholder = "Ask something first!";
    input.style.borderColor = "#ff6b6b";
    hint.textContent = "✋ Ask something!";
    hint.style.color = "rgba(255,150,150,0.5)";
    setTimeout(() => {
      input.placeholder = "Ask a yes/no question...";
      input.style.borderColor = "rgba(255,255,255,0.15)";
      hint.textContent = "Drag to view any angle · Type a question, then tap the ball";
      hint.style.color = "";
    }, 1500);
    return;
  }

  isShaking = true;
  hint.textContent = "🔮 Thinking...";
  hint.style.color = "rgba(180,200,255,0.5)";

  // Clear answer during shake
  currentAnswer = '';
  answerOpacity = 0;

  let answer;
  do {
    answer = answers[Math.floor(Math.random() * answers.length)];
  } while (answer === lastAnswer);
  lastAnswer = answer;

  // Animate shake by rapidly oscillating rotX/rotY
  let shakeFrame = 0;
  const origX = rotX, origY = rotY;
  function shakeAnim() {
    if (shakeFrame > 8) {
      rotX = origX;
      rotY = origY;
      currentAnswer = answer;
      answerOpacity = 1;
      drawSphere();
      updateWindowClick();
      hint.textContent = "Drag to view any angle · Type a question, then tap the ball";
      hint.style.color = "";

      const entry = document.createElement('p');
      entry.innerHTML = `<strong>Q:</strong> ${question} &rarr; ${answer}`;
      history.prepend(entry);
      while (history.children.length > 10) history.removeChild(history.lastChild);

      isShaking = false;
      return;
    }
    const t = shakeFrame * 0.15;
    rotX = origX + Math.sin(t * 20) * 12;
    rotY = origY + Math.cos(t * 15) * 15;
    drawSphere();
    shakeFrame++;
    requestAnimationFrame(shakeAnim);
  }

  shakeAnim();

  input.value = '';
  input.focus();
}

// Make the window clickable via an overlay div that tracks the window position
function updateWindowClick() {
  const el = document.getElementById('windowClick');
  const ry = rotY * DEG;
  const rx = rotX * DEG;
  const winRadius = R * 0.38;
  const winX = CX + Math.sin(ry) * winRadius;
  const winY = CY + Math.sin(rx) * winRadius;
  const scale = Math.abs(Math.cos(ry) * Math.cos(rx));

  if (scale > 0.05 && Math.cos(ry) * Math.cos(rx) > 0) {
    el.style.display = 'block';
    el.style.left = (winX / 3 - 50 * scale + 50) + '%';
    el.style.top = (winY / 3 - 45 * scale + 50) + '%';
    el.style.width = (100 * scale) + 'px';
    el.style.height = (90 * scale) + 'px';
    el.style.clipPath = `polygon(50% 5%, 93% 88%, 7% 88%)`;
    el.style.transform = `translate(-50%, -50%) rotate(${rotY * 0.3}deg)`;
  } else {
    el.style.display = 'none';
  }
}

// 3D drag — free rotation around both axes
const scene = document.getElementById('scene');

scene.onpointerdown = function (e) {
  isDragging = true;
  prevX = e.clientX;
  prevY = e.clientY;
  scene.setPointerCapture(e.pointerId);
};

scene.onpointermove = function (e) {
  if (!isDragging) return;
  const dx = e.clientX - prevX;
  const dy = e.clientY - prevY;
  rotY += dx * 0.6;
  rotX += dy * 0.6;
  rotX = Math.max(-85, Math.min(85, rotX));
  prevX = e.clientX;
  prevY = e.clientY;
  applyRotation();
  updateWindowClick();
};

scene.onpointerup = scene.onpointercancel = function () {
  isDragging = false;
};

applyRotation();
updateWindowClick();

// Shake detection
let shakeThreshold = 15;
let lastAccel = { x: 0, y: 0, z: 0 };
let lastShakeTime = 0;

if (window.DeviceMotionEvent) {
  if (typeof DeviceMotionEvent.requestPermission === 'function') {
    document.addEventListener('click', function init() {
      DeviceMotionEvent.requestPermission();
      document.removeEventListener('click', init);
    }, { once: true });
  }

  window.addEventListener('devicemotion', function (e) {
    const a = e.accelerationIncludingGravity;
    if (!a.x && !a.y && !a.z) return;

    const dx = Math.abs(a.x - lastAccel.x);
    const dy = Math.abs(a.y - lastAccel.y);
    const dz = Math.abs(a.z - lastAccel.z);

    if ((dx + dy + dz) > shakeThreshold && Date.now() - lastShakeTime > 1000) {
      lastShakeTime = Date.now();
      shake();
    }
    lastAccel = { x: a.x, y: a.y, z: a.z };
  });
}
</script>
</body>
</html>
